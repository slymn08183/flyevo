[project]
name = "flyevo"
version = "0.0.1"
description = "In-silico evolution of the Drosophila olfactory circuit, tested against comparative connectomics."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
authors = [{ name = "The flyevo Authors" }]
keywords = ["drosophila", "connectomics", "evolution", "jax", "neuroscience"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core deps stay permissive (Apache/MIT/BSD). Exact versions are pinned by uv.lock.
dependencies = [
    "jax>=0.4.35",
    "evosax>=0.3,<0.4",
    "qdax>=0.5",
    "pymoo>=0.6.1",
    "neuprint-python>=0.5",
    "navis>=1.10",
    "polars>=1.0",
    "pyarrow>=17",
    "numpy>=1.26",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "typer>=0.12",
    "rerun-sdk>=0.38,<0.39",
    "mlflow>=3.0,<4",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# JAX CUDA wheels are Linux-only (WSL2 / Docker). Never install on native Windows.
cuda = ["jax[cuda12]>=0.4.35; sys_platform == 'linux'"]
# M1 pre-test only. Brian2 is CeCILL, FlyWire data is CC BY-NC → never imported from src/flyevo/.
pretest = ["brian2>=2.10", "fafbseg>=3.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
]

[project.scripts]
flyevo = "flyevo.cli:app"

[tool.uv]
# navis caps pykdtree<=1.3.12 on macOS only; without this uv picks that wheel-less version
# everywhere → C source build in Docker. Linux/Windows get the wheel-shipping 1.4+.
constraint-dependencies = ["pykdtree>=1.4; sys_platform != 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyevo"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["src/flyevo"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "golden: 2-min CPU smoke evolution vs reference metrics",
    "slow: excluded from the default quick loop",
]
