name: flyevo

x-flyevo-common: &flyevo-common
  volumes:
    - ../data:/app/data
    - ../runs:/app/runs
    - ../configs:/app/configs
  env_file:
    - path: ../.env
      required: false
  ports:
    - "9090:9090" # rerun web viewer

services:
  flyevo-cpu:
    <<: *flyevo-common
    profiles: [cpu]
    build: { context: .., dockerfile: docker/Dockerfile, target: cpu }

  flyevo-cuda:
    <<: *flyevo-common
    profiles: [cuda]
    build: { context: .., dockerfile: docker/Dockerfile, target: cuda }
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  mlflow:
    profiles: [cpu, cuda]
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////runs/mlflow/mlflow.db
      --artifacts-destination /runs/mlflow/artifacts
    volumes: [../runs:/runs]
    ports: ["5000:5000"]
