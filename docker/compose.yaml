name: flyevo

services:
  flyevo:
    build: { context: .., dockerfile: docker/Dockerfile }
    volumes:
      - ../src:/app/src # project is installed editable → code changes need no rebuild
      - ../scripts:/app/scripts
      - ../data:/app/data
      - ../runs:/app/runs
      - ../configs:/app/configs
    env_file:
      - path: ../.env
        required: false
    ports:
      - "9090:9090" # rerun web viewer
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////runs/mlflow/mlflow.db
      --artifacts-destination /runs/mlflow/artifacts
    volumes: [../runs:/runs]
    ports: ["5000:5000"]
